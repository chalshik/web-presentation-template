<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="Espresso machine, front view">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eceff1"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="#3a4550" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- cup warmer rail -->
    <rect x="200" y="86" width="320" height="24" rx="9" fill="#e2e6e9"/>

    <!-- main body -->
    <rect x="180" y="110" width="360" height="282" rx="16" fill="url(#body)"/>
    <rect x="204" y="136" width="312" height="230" rx="10" stroke="#93a0aa" stroke-width="1.5"/>

    <!-- pressure gauge -->
    <circle cx="272" cy="212" r="46" fill="#ffffff"/>
    <circle cx="272" cy="212" r="38" stroke="#93a0aa" stroke-width="1.5"/>
    <g stroke="#93a0aa" stroke-width="2">
      <line x1="272" y1="180" x2="272" y2="187" transform="rotate(-120 272 212)"/>
      <line x1="272" y1="180" x2="272" y2="187" transform="rotate(-60 272 212)"/>
      <line x1="272" y1="180" x2="272" y2="187"/>
      <line x1="272" y1="180" x2="272" y2="187" transform="rotate(60 272 212)"/>
      <line x1="272" y1="180" x2="272" y2="187" transform="rotate(120 272 212)"/>
    </g>
    <line x1="272" y1="212" x2="272" y2="186" stroke="#b8781f" stroke-width="3" transform="rotate(62 272 212)"/>
    <circle cx="272" cy="212" r="4.5" fill="#b8781f" stroke="none"/>

    <!-- control cluster -->
    <rect x="368" y="188" width="120" height="48" rx="8" fill="#ffffff" stroke="#93a0aa" stroke-width="1.5"/>
    <line x1="386" y1="212" x2="404" y2="212" stroke="#93a0aa"/>
    <line x1="418" y1="212" x2="436" y2="212" stroke="#93a0aa"/>
    <line x1="450" y1="212" x2="468" y2="212" stroke="#b8781f"/>
    <g fill="#93a0aa" stroke="none">
      <circle cx="392" cy="286" r="9"/>
      <circle cx="428" cy="286" r="9"/>
      <circle cx="464" cy="286" r="9"/>
    </g>
    <circle cx="356" cy="286" r="9" fill="#b8781f" stroke="none"/>

    <!-- group head -->
    <rect x="300" y="392" width="120" height="36" rx="7" fill="#e2e6e9"/>
    <path d="M318 428h84l-10 26h-64z" fill="#ffffff"/>
    <rect x="404" y="432" width="116" height="16" rx="8" fill="#e2e6e9"/>
    <line x1="350" y1="454" x2="350" y2="466"/>
    <line x1="370" y1="454" x2="370" y2="466"/>

    <!-- pours -->
    <g stroke="#b8781f" stroke-width="2" opacity="0.85">
      <line x1="350" y1="470" x2="350" y2="486"/>
      <line x1="370" y1="470" x2="370" y2="486"/>
    </g>

    <!-- cup -->
    <path d="M330 488h60l-8 34h-44z" fill="#ffffff"/>
    <path d="M392 494c12 0 12 16 0 16"/>

    <!-- steam wand / hot water tap -->
    <path d="M540 300c26 6 38 28 40 58l-2 40" stroke-width="6"/>
    <circle cx="578" cy="400" r="5" fill="#e2e6e9"/>
    <path d="M180 300c-26 6-38 28-40 58l2 40" stroke-width="6"/>
    <circle cx="142" cy="400" r="5" fill="#e2e6e9"/>

    <!-- drip tray -->
    <rect x="170" y="524" width="380" height="26" rx="7" fill="#e2e6e9"/>
    <line x1="210" y1="537" x2="330" y2="537" stroke="#93a0aa" stroke-width="1.5"/>
    <line x1="390" y1="537" x2="510" y2="537" stroke="#93a0aa" stroke-width="1.5"/>
  </g>
</svg>
